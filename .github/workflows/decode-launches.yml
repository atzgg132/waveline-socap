name: Decode launches corpus
on:
  push:
    paths:
      - data/launches.json.gz.b64
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode launches.json from gzip+base64 sidecar
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib, hashlib
          b64 = pathlib.Path('data/launches.json.gz.b64').read_text().strip()
          raw = gzip.decompress(base64.b64decode(b64))
          pathlib.Path('data/launches.json').write_bytes(raw)
          print('wrote', len(raw), 'sha16', hashlib.sha256(raw).hexdigest()[:16])
          PY
      - name: Commit launches.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/launches.json
          git diff --cached --quiet || git commit -m "Add Phase 0-1 corpus + README stub"
          git push
