name: decode-xwave-sidecar
on:
  workflow_dispatch:
  push:
    paths:
      - data/x-wave-arnav.json.gz.b64
      - .github/workflows/decode-xwave-sidecar.yml
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode gzip.b64 sidecar into x-wave-arnav.json
        run: |
          python3 - <<'PY'
          import gzip, base64, pathlib
          b64 = pathlib.Path("data/x-wave-arnav.json.gz.b64").read_text().strip()
          raw = gzip.decompress(base64.b64decode(b64))
          pathlib.Path("data/x-wave-arnav.json").write_bytes(raw)
          print("wrote", len(raw), "bytes")
          PY
      - name: Commit decoded file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/x-wave-arnav.json
          git diff --staged --quiet || git commit -m "Corpus: actually ship 69-row launches + x-wave (fix stale 42-row)"
          git push
